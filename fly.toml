# fly.toml app configuration file generated for twowords on 2025-07-31T08:50:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'twowords'
primary_region = 'lhr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '128mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 128
